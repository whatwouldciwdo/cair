events { worker_connections 2048; }
http {
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  client_max_body_size 25m;
  server_tokens off;
  server {
    listen 80;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/ { limit_req zone=api burst=40 nodelay; proxy_pass http://web:3006; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_buffering off; proxy_read_timeout 300s; }
    location /grafana/ { proxy_pass http://grafana:3000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; }
    location / { proxy_pass http://web:3006; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 300s; }
  }
}